version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Hardening: Cách ly mạng DB, không cho truy cập từ Internet

volumes:
  db_data:
  wp_data:
  grafana_data:

services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: wp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Strong_Root_Password_2026!
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: Strong_User_Password_2026!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-net

  # 2. Ứng dụng Web WordPress
  wordpress:
    image: wordpress:latest
    container_name: wp_app
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: Strong_User_Password_2026!
    volumes:
      - wp_data:/var/www/html
    networks:
      - frontend-net
      - backend-net

  # 3. Công cụ quản lý DB phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wp_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - frontend-net
      - backend-net

  # 4. Reverse Proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend-net

  # 5. Giám sát Metrics: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: wp_prometheus
    ports:
      - "9090:9090"
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - frontend-net
      - backend-net

  # 6. Giao diện Giám sát: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: wp_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend-net

  # Exporter 1: cAdvisor (Đã dùng zcube/cadvisor chống lỗi mạng)
  cadvisor:
    image: zcube/cadvisor:latest
    container_name: wp_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend-net

  # Exporter 2: Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: wp_nginx_exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - frontend-net

  # 7. Quản lý Log: Loki
  loki:
    image: grafana/loki:latest
    container_name: wp_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - frontend-net

  # Quản lý Log: Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: wp_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - frontend-net